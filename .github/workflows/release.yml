name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            platform: linux-amd64
          - goos: linux
            goarch: arm64
            platform: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install JS dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        working-directory: frontend
        run: pnpm check

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Extract version from package.json
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # herdr-core (the daemon behind the Baikal tile, and `suwu hc`) is embedded
      # per release artifact, so a machine that never installed it can still run
      # `suwu hc server start`. The archive is fetched for the matrix target and
      # verified against the pinned lock before `-tags hcbin` embeds it.
      - name: Fetch herdr-core for this target
        run: ./scripts/fetch-herdr-core.sh --goos ${{ matrix.goos }} --goarch ${{ matrix.goarch }}

      - name: Cross-compile binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -tags hcbin \
            -ldflags "-s -w -X suwu/pkg/version.Version=${{ steps.version.outputs.version }}" \
            -o suwu \
            ./cmd/Suwu

      - name: Build suwu-max bundle
        if: matrix.goos == 'linux'
        run: |
          ./scripts/build-max.sh \
            --skip-frontend \
            --goos "${{ matrix.goos }}" \
            --goarch "${{ matrix.goarch }}" \
            --version "${{ steps.version.outputs.version }}"

      - name: Package release archive
        run: |
          mkdir -p dist
          ARCHIVE="dist/suwu-${{ steps.version.outputs.version }}-${{ matrix.platform }}"
          if [ -f LICENSE ]; then
            tar -cf "${ARCHIVE}.tar" suwu LICENSE
          else
            tar -cf "${ARCHIVE}.tar" suwu
          fi
          gzip "${ARCHIVE}.tar"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
