<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the phone shell pads itself with the safe-area
         insets instead of shrinking the page; interactive-widget lets Android
         resize the layout when the keyboard opens (iOS is handled with
         visualViewport). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- PWA: installable on a phone home screen, launched standalone (no
         browser chrome, so the mobile shell's fixed header is the only chrome).
         start_url is "/" — the redirect picks /mobile for the device. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Suwu" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <title>Suwu</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
