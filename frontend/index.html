<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the phone shell pads itself with the safe-area
         insets instead of shrinking the page; interactive-widget lets Android
         resize the layout when the keyboard opens (iOS is handled with
         visualViewport). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- PWA: installable on a phone home screen, launched standalone (no
         browser chrome, so the mobile shell's fixed header is the only chrome).
         start_url is "/" — the redirect picks /mobile for the device. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Suwu" />
    <!-- iOS ignores an SVG touch icon and invents a letter tile instead, so the
         home-screen icon has to be a PNG. One link per size: iOS asks for the
         size its device wants (120/152/167/180) and older versions fall back to
         a blank screenshot when none match. Bump ?v= when the artwork changes —
         Safari caches a web app's icon per URL and will otherwise keep showing
         the old one. Regenerate the PNGs with scripts/gen-icons.mjs. -->
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-120.png?v=2" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png?v=2" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png?v=2" />
    <title>Suwu</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
